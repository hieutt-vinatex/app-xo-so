[project]
name = "xsmb-gdb-realtime"
version = "1.0.0"
description = "Realtime XSMB special-prize (2 last digits) statistics dashboard backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.setuptools]
packages = ["app"]
